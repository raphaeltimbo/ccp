[project]
name = "ccp-desktop"
version = "0.1.0"
description = "CCP Desktop - Centrifugal Compressor Performance"
requires-python = ">=3.10"
dependencies = [
    "django>=5.0",
    "django-htmx>=1.17",
    "whitenoise>=6.5",
    "ccp-performance",
]

[tool.uv.sources]
ccp-performance = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "evaluation"]
