{# PI server configuration partial. #}
{% load ccp_tags %}
<details class="ccp-expander" open>
  <summary>Servidor PI</summary>
  <div class="body" x-data="{ auth: '{{ forms.pi_form.pi_auth_method.value|default_if_none:'' }}' }">
    {% form_param_rows forms.pi_form %}
    {% for err in forms.pi_form.non_field_errors %}
      <div class="ccp-param-row__error">{{ err }}</div>
    {% endfor %}
  </div>
</details>
