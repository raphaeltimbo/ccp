[project]
name = "ccp-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "ccp-performance",
]

[tool.uv.sources]
ccp-performance = { path = "../", editable = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
