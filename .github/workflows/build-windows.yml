name: Build Windows desktop

on:
  push:
    branches:
      - ccp-electron-django
    paths:
      - "desktop/**"
      - "ccp/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .exe + portable .zip
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Python environment
        run: uv sync

      - name: Install PyInstaller into the synced environment
        run: uv pip install pyinstaller

      - name: Build Django sidecar (PyInstaller)
        run: uv run pyinstaller build.spec --noconfirm --clean

      - name: Smoke-test the sidecar
        run: |
          Start-Process -FilePath ".\dist\ccp-django\ccp-django.exe" -ArgumentList "runserver","8419","--noreload" -PassThru | Out-Null
          $attempt = 0
          while ($attempt -lt 30) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8419/straight-through/" -TimeoutSec 2
              if ($r.StatusCode -eq 200) {
                Write-Host "sidecar responded 200"
                exit 0
              }
            } catch { Start-Sleep -Seconds 1 }
            $attempt++
          }
          Write-Error "sidecar never responded"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install Electron deps
        # --package-lock-only on first run if no lockfile; otherwise use ci.
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Build Electron app
        run: npx electron-builder --win --publish never
        env:
          # Skip code signing — unsigned build, users will see SmartScreen warning.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ccp-desktop-installer
          path: desktop/dist-electron/*Setup*.exe
          if-no-files-found: error

      - name: Upload portable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: ccp-desktop-portable
          path: desktop/dist-electron/*.zip
          if-no-files-found: error
